name: ReaPack index


# Regenerates index.xml automatically on every push that touches
# plugin files, so students always get the latest versions.
on:
  push:
    branches: [main]
    paths:
      - '**.jsfx'
      - '**.png'
      - '.github/workflows/reapack-index.yml'
name: ReaPack index


# Regenerates index.xml automatically on every push that touches
# plugin files, so students always get the latest versions.
on:
  push:
    branches: [main]
    paths:
      - '**.jsfx'
      - '**.png'
      - '.github/workflows/reapack-index.yml'


permissions:
  contents: write


jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: gem install reapack-index
      - run: reapack-index --about README.md .
      - name: Commit updated index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.xml
          git diff --cached --quiet || git commit -m "Update index.xml [skip ci]"
          git push


